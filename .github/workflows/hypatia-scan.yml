# SPDX-License-Identifier: MPL-2.0
# Hypatia neurosymbolic security scanning for selur
name: Hypatia Scan

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: '30 5 * * 1'  # Weekly Monday 05:30 UTC

# Declared at workflow level and NOT overridden on the job below. A job-level
# block REPLACES this one, and the reusable declares
# `actions: read / contents: read / security-events: write` — omitting any of
# them makes the call a permission escalation, which GitHub rejects before any
# job starts (a zero-job run that `gh pr checks` never surfaces).
permissions:
  actions: read
  contents: read
  security-events: write

jobs:
  scan:
    # NOTE: no `timeout-minutes` here. It is illegal on a `uses:` job and kills
    # the workflow at parse time; the reusable sets its own (20 min).
    uses: hyperpolymath/standards/.github/workflows/hypatia-scan-reusable.yml@bd0df9ead7faf0cdfe0e13e7966d91e28d0101d4
