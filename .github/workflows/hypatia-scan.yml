# SPDX-License-Identifier: MPL-2.0
# Hypatia neurosymbolic security scanning for selur
name: Hypatia Scan

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: '30 5 * * 1'  # Weekly Monday 05:30 UTC

permissions: read-all

jobs:
  hypatia-scan:
    name: Neurosymbolic Security Scan
    timeout-minutes: 10
    runs-on: ubuntu-latest
    permissions:
      security-events: write
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v5
        with:
          fetch-depth: 0

      - name: Run Hypatia scan
        uses: hyperpolymath/hypatia-action@c4e1b5b3631f9d897c230c9d43b0b8e3f43e9a4f # main
        with:
          scan-depth: full
          report-format: sarif
          fail-on-critical: true

      - name: Upload SARIF results
        if: always()
        uses: github/codeql-action/upload-sarif@5595ccaf912efad79be6eef63a5619ff05969be3 # v4
        with:
          sarif_file: hypatia-results.sarif
        continue-on-error: true
