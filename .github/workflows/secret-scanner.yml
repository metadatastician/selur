# SPDX-License-Identifier: MPL-2.0
# Calls the estate's shared secret scanner (gitleaks + rust-secrets +
# shell-secrets). Added because this repository had NO leak scanning at all.
#
# Least privilege: the reusable declares no `workflow_call` secrets and
# consumes no `secrets.*` context, so `secrets: inherit` is deliberately
# absent — it would forward every repository and organisation secret for no
# benefit. The scanner needs only the read-only `GITHUB_TOKEN` permissions
# granted below.
name: "Secret Scanner"
on:
  pull_request:
  push:
    branches: [main, master]
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  scan:
    # 56142ffc (2026-11-08) is the current standards main revision. Its
    # regenerated Actions lockfile has tag-backed leaf refs; the reusable sets
    # `persist-credentials: false` on the read-only scanner checkouts
    # (standards#1426) and fails closed when promisor/history objects are
    # unreadable (standards#1427). The callee declares no `workflow_call`
    # secrets, so no `secrets:` line is needed here.
    uses: metadatastician/standards/.github/workflows/secret-scanner-reusable.yml@56142ffc09a6c8da3c4c2ff35ce3d0b6236bf3a5
