# SPDX-License-Identifier: MPL-2.0
# Calls the estate's shared secret scanner (gitleaks + rust-secrets +
# shell-secrets). Added because this repository had NO leak scanning at all.
#
# Least privilege: the reusable declares no `workflow_call` secrets and
# consumes no `secrets.*` context, so `secrets: inherit` is deliberately
# absent — it would forward every repository and organisation secret for no
# benefit. The scanner needs only the read-only `GITHUB_TOKEN` permissions
# granted below.
name: "Secret Scanner"
on:
  pull_request:
  push:
    branches: [main, master]
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  scan:
    # a3308ea (2026-09-04) carried an Actions lockfile whose leaf `refs`
    # entries were the pins' own SHAs rather than tags; runner setup rejects
    # that as an "invalid lockfile pin" before any scanner can start.
    # 8ff9ce65 (2026-10-18) has the regenerated lockfile and passed all three
    # scanners in metadatastician/vordr#39.
    uses: hyperpolymath/standards/.github/workflows/secret-scanner-reusable.yml@8ff9ce65f7e54f8d5c5aa94584e2ead0f2ba460f
