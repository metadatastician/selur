# SPDX-License-Identifier: MPL-2.0
# Dependabot configuration for RSR-compliant repositories
# Trimmed to the ecosystems present at the repo root. selur is a Rust/Cargo
# workspace (root Cargo.toml). The mix/deno manifests in this repo live only
# under integrations/ (vendored sub-projects, not selur's own dependencies)
# and are intentionally unmanaged. mix/npm/pip/nix declared at "/" had no
# root manifest and only produced red "Dependabot Updates" runs.

version: 2
updates:
  # GitHub Actions - always include
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    groups:
      actions:
        patterns:
          - "*"

  # Rust/Cargo (root workspace manifest)
  - package-ecosystem: "cargo"
    directory: "/"
    schedule:
      interval: "weekly"
    # `open-pull-requests-limit: 0` suppresses routine version-update PRs
    # while leaving Dependabot SECURITY PRs flowing. The previous
    # `ignore: "*" patch` rule also silenced security PRs under GitHub's
    # current Dependabot behaviour. See rsr-template-repo commit 78b050e
    # and 007-lang/audits/audit-dependabot-automation-gap-2026-04-17.md.
    open-pull-requests-limit: 0
